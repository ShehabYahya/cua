[project]
name = "cua-driver-jev-desktop-agent-example"
version = "0.2.0"
description = "General desktop agent loop with Cua Driver, TypeSafe Jev categorical decisions, local operation bundles, lazy perception, and voice"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.26.0,<2",
  "typesafe-sdk>=0.6.0,<1",
]

[project.optional-dependencies]
voice = [
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
]
gui = [
  "PySide6>=6.8,<7",
  "keyring>=25,<26",
  "SecretStorage>=3.3,<4",
  "dbus-next>=0.2.3,<1",
]
app = [
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "PySide6>=6.8,<7",
  "keyring>=25,<26",
  "SecretStorage>=3.3,<4",
  "dbus-next>=0.2.3,<1",
]
deploy = [
  "Nuitka>=4.1,<5",
  "pip-licenses>=5,<6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []
