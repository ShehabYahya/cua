name: "Maintenance: sync Porter uv lock"

on:
  push:
    branches:
      - "feat/jev-general-desktop-agent"
    paths:
      - ".github/workflows/sync-porter-lock.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: libs/cua-driver/examples/jev-desktop-agent

jobs:
  sync:
    if: github.repository == 'ShehabYahya/cua'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/jev-general-desktop-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Resolve lockfile
        run: uv lock

      - name: Commit lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "Porter uv.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(porter): sync uv lockfile"
          git push origin HEAD:feat/jev-general-desktop-agent
