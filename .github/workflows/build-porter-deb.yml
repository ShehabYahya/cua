name: "CI: Porter deb package"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "libs/cua-driver/examples/jev-desktop-agent/python/**"
      - "libs/cua-driver/examples/jev-desktop-agent/ui/**"
      - "libs/cua-driver/examples/jev-desktop-agent/assets/**"
      - "libs/cua-driver/examples/jev-desktop-agent/packaging/linux/**"
      - "libs/cua-driver/examples/jev-desktop-agent/pyproject.toml"
      - "libs/cua-driver/examples/jev-desktop-agent/uv.lock"
      - ".github/workflows/build-porter-deb.yml"
  push:
    paths:
      - "libs/cua-driver/examples/jev-desktop-agent/python/**"
      - "libs/cua-driver/examples/jev-desktop-agent/ui/**"
      - "libs/cua-driver/examples/jev-desktop-agent/assets/**"
      - "libs/cua-driver/examples/jev-desktop-agent/packaging/linux/**"
      - "libs/cua-driver/examples/jev-desktop-agent/pyproject.toml"
      - "libs/cua-driver/examples/jev-desktop-agent/uv.lock"
      - ".github/workflows/build-porter-deb.yml"

permissions:
  contents: read

concurrency:
  group: ci-porter-deb-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libs/cua-driver/examples/jev-desktop-agent

jobs:
  build-deb:
    name: Build and verify amd64 deb
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Resolve canonical Porter version
        id: porter-version
        run: |
          VERSION="$(PYTHONPATH=python python3 -c 'from version import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            ccache \
            desktop-file-utils \
            libegl1 \
            libgl1 \
            libportaudio2 \
            libxkbcommon-x11-0 \
            lintian \
            patchelf

      - name: Build Porter deb
        run: bash packaging/linux/build-deb.sh "${{ steps.porter-version.outputs.version }}"

      - name: Inspect package contents
        run: |
          DEB="$(find dist -maxdepth 1 -name 'porter_${{ steps.porter-version.outputs.version }}_*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee /tmp/porter-package-contents.txt
          grep -q './usr/libexec/porter/porter' /tmp/porter-package-contents.txt
          grep -q './usr/bin/porter' /tmp/porter-package-contents.txt
          grep -q './usr/share/applications/io.github.shehabyahya.Porter.desktop' /tmp/porter-package-contents.txt
          grep -q './usr/share/icons/hicolor/scalable/apps/io.github.shehabyahya.Porter.svg' /tmp/porter-package-contents.txt
          grep -q './usr/share/metainfo/io.github.shehabyahya.Porter.metainfo.xml' /tmp/porter-package-contents.txt
          grep -q './usr/share/doc/porter-desktop/copyright' /tmp/porter-package-contents.txt
          grep -q './usr/share/doc/porter-desktop/third-party-licenses.txt' /tmp/porter-package-contents.txt
          lintian --fail-on error "$DEB"

      - name: Smoke-test packaged executable
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          OPENROUTER_API_KEY: ""
          TYPESAFE_API_KEY: ""
        run: |
          rm -rf /tmp/porter-deb-check
          mkdir -p /tmp/porter-deb-check
          DEB="$(find dist -maxdepth 1 -name 'porter_${{ steps.porter-version.outputs.version }}_*.deb' -print -quit)"
          dpkg-deb -x "$DEB" /tmp/porter-deb-check
          /tmp/porter-deb-check/usr/libexec/porter/porter --version | grep -q '^Porter ${{ steps.porter-version.outputs.version }}$'
          /tmp/porter-deb-check/usr/libexec/porter/porter --smoke-test

      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.shehabyahya.Porter.desktop
          appstreamcli validate --no-net \
            packaging/linux/io.github.shehabyahya.Porter.metainfo.xml

      - name: Test install, upgrade, and uninstall lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          OPENROUTER_API_KEY: ""
          TYPESAFE_API_KEY: ""
        run: |
          DEB="$(find dist -maxdepth 1 -name 'porter_${{ steps.porter-version.outputs.version }}_*.deb' -print -quit)"
          sudo apt-get install -y "$PWD/$DEB"
          test "$(porter --version)" = "Porter ${{ steps.porter-version.outputs.version }}"
          porter --smoke-test
          sudo apt-get install -y --reinstall "$PWD/$DEB"
          test "$(porter --version)" = "Porter ${{ steps.porter-version.outputs.version }}"
          sudo apt-get remove -y porter-desktop
          test ! -e /usr/libexec/porter/porter
          test ! -e /usr/bin/porter
          test ! -e /usr/share/applications/io.github.shehabyahya.Porter.desktop

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: porter-deb-${{ github.sha }}
          path: libs/cua-driver/examples/jev-desktop-agent/dist/*.deb
          if-no-files-found: error
          retention-days: 14
