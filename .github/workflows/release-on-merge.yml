name: "CD: Auto Release on Merge"

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  porter-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: porter-auto-release
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out the PR base branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Detect Porter changes and create a release commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(gh api --paginate \
            "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename')"
          if ! grep -Eq '^(libs/cua-driver/examples/jev-desktop-agent/|\.github/workflows/(release-porter|build-porter-deb|ci-porter-gui|capture-porter-ui)\.yml$)' <<< "$changed_files"; then
            echo "No Porter files changed; skipping Porter release."
            exit 0
          fi
          echo "Porter files changed in PR #$PR_NUMBER."

          if jq -e 'index("no-release") != null' <<< "$LABELS" >/dev/null; then
            echo "no-release label found; skipping Porter release successfully."
            exit 0
          fi

          major_count="$(jq '[.[] | select(. == "bump:major")] | length' <<< "$LABELS")"
          minor_count="$(jq '[.[] | select(. == "bump:minor")] | length' <<< "$LABELS")"
          if (( major_count + minor_count > 1 )); then
            echo "::error::Conflicting bump:major and bump:minor labels; no Porter release was created."
            exit 1
          elif (( major_count == 1 )); then
            bump=major
          elif (( minor_count == 1 )); then
            bump=minor
          else
            bump=patch
          fi
          echo "Selected Porter version bump: $bump"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The job-level concurrency group serializes Porter releases. Refresh
          # the base branch on each attempt so version calculation uses its
          # latest state, including a concurrent non-Porter merge.
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BASE_BRANCH"
            git reset --hard "origin/$BASE_BRANCH"

            prior_release="$(git log -1 --format='%H%x09%s' \
              --grep="^Porter-PR: #$PR_NUMBER$" "origin/$BASE_BRANCH")"
            if [[ -n "$prior_release" ]]; then
              prior_sha="${prior_release%%$'\t'*}"
              prior_subject="${prior_release#*$'\t'}"
              if [[ ! "$prior_subject" =~ ^chore\(porter\):\ release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                echo "::error::Found an invalid prior Porter release commit for PR #$PR_NUMBER."
                exit 1
              fi
              version="${BASH_REMATCH[1]}"
              tag="porter-v$version"
              tag_refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
              tag_commit="$(awk -v peeled="refs/tags/$tag^{}" '$2 == peeled { print $1 }' <<< "$tag_refs")"
              if [[ "$tag_commit" != "$prior_sha" ]]; then
                echo "::error::Existing release commit for PR #$PR_NUMBER does not have its expected immutable tag $tag."
                exit 1
              fi

              prior_runs="$(gh run list --repo "$REPO" \
                --workflow release-porter.yml \
                --event workflow_dispatch \
                --branch "$tag" \
                --json status,conclusion)"
              if jq -e 'any(.[]; .status == "queued" or .status == "in_progress" or .status == "waiting" or (.status == "completed" and .conclusion == "success"))' \
                <<< "$prior_runs" >/dev/null; then
                echo "Release publisher already ran or is active for $tag; no duplicate dispatch."
                exit 0
              fi

              echo "Resuming the existing Porter release $tag for PR #$PR_NUMBER."
              gh workflow run release-porter.yml \
                --repo "$REPO" \
                --ref "$tag" \
                -f "version=$version" \
                -f "prerelease=false"
              echo "Dispatched Release: Porter for $tag."
              exit 0
            fi

            version_file="libs/cua-driver/examples/jev-desktop-agent/python/version.py"
            version="$(python3 .github/scripts/porter_release.py "$version_file" "$bump")"
            tag="porter-v$version"

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists; refusing to overwrite it."
              exit 1
            fi

            git add -- "$version_file"
            git commit \
              -m "chore(porter): release v$version" \
              -m "Porter-PR: #$PR_NUMBER"
            git tag -a "$tag" -m "Porter v$version"

            if git push --atomic origin \
              "HEAD:refs/heads/$BASE_BRANCH" \
              "refs/tags/$tag"; then
              pushed=true
              break
            fi

            # A concurrent branch update can reject the non-forced push.
            # Drop only the local tag/commit and recalculate from the new tip.
            git tag -d "$tag"
            git reset --hard
            echo "Push raced with another base-branch update; retrying from latest $BASE_BRANCH (attempt $attempt/5)."
          done

          if [[ "$pushed" != true ]]; then
            echo "::error::Could not push Porter release after five fresh-base attempts."
            exit 1
          fi

          echo "Created Porter release commit and immutable tag $tag at $(git rev-parse HEAD)."
          # GITHUB_TOKEN pushes intentionally do not start push-triggered
          # workflows. Dispatch the dedicated publisher against the exact tag.
          gh workflow run release-porter.yml \
            --repo "$REPO" \
            --ref "$tag" \
            -f "version=$version" \
            -f "prerelease=false"
          echo "Dispatched Release: Porter for $tag."

  upstream-auto-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check upstream release credentials
        id: credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -n "$APP_ID" && -n "$PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Upstream release credentials are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_APP_ID or RELEASE_APP_PRIVATE_KEY is unavailable; skipping upstream package auto-release."
          fi

      - name: Generate App Token
        id: app-token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Detect packages, release labeled, notify unlabeled
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          # Release authorization comes only from audited label events. Never
          # read PR bodies, comments, task lists, or checkbox state here.

          # Skip everything if no-release
          if echo "$LABELS" | grep -q '"no-release"'; then
            echo "no-release label found, skipping."
            exit 0
          fi

          # A label only authorizes a release when its latest add/remove event
          # shows that the release owner applied it and it remains present.
          LABEL_EVENTS=$(gh api --paginate --slurp \
            "repos/$REPO/issues/$PR_NUMBER/events?per_page=100")

          label_was_applied_by_release_owner() {
            local label=$1
            jq -e --arg label "$label" '
              [
                .[][]
                | select(
                    (.event == "labeled" or .event == "unlabeled")
                    and .label.name == $label
                  )
              ]
              | last
              | .event == "labeled" and .actor.login == "f-trycua"
            ' <<< "$LABEL_EVENTS" > /dev/null
          }

          # Determine bump type from labels (default: patch)
          BUMP_TYPE="patch"
          if echo "$LABELS" | grep -q '"bump:major"'; then
            if ! label_was_applied_by_release_owner "bump:major"; then
              echo "::warning::bump:major was not applied by f-trycua; skipping auto-release."
              exit 0
            fi
            BUMP_TYPE="major"
          elif echo "$LABELS" | grep -q '"bump:minor"'; then
            if ! label_was_applied_by_release_owner "bump:minor"; then
              echo "::warning::bump:minor was not applied by f-trycua; skipping auto-release."
              exit 0
            fi
            BUMP_TYPE="minor"
          fi
          echo "Bump type: $BUMP_TYPE"

          # Get changed files
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only 2>/dev/null || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files, skipping."
            exit 0
          fi

          # Map paths to publishable services
          declare -A PATH_TO_SERVICE=(
            ["libs/python/cua-cli/"]="pypi/cli"
            ["libs/python/cua-auto/"]="pypi/auto"
            ["libs/python/agent/"]="pypi/agent"
            ["libs/python/computer/"]="pypi/computer"
            ["libs/python/cua-cloud/"]="pypi/cloud"
            ["libs/python/core/"]="pypi/core"
            ["libs/python/som/"]="pypi/som"
            ["libs/python/bench-ui/"]="pypi/bench-ui"
            ["libs/cua-bench/"]="pypi/bench"
            ["libs/python/computer-server/"]="pypi/computer-server"
            ["libs/python/mcp-server/"]="pypi/mcp-server"
            ["libs/typescript/cua-cli/"]="npm/cli"
            ["libs/typescript/computer/"]="npm/computer"
            ["libs/typescript/core/"]="npm/core"
            ["libs/typescript/fleet/"]="npm/fleet"
            ["libs/typescript/playground/"]="npm/playground"
            ["libs/cuabot/"]="npm/cuabot"
            ["libs/xfce-cua/"]="docker/xfce-cua"
            ["libs/xfce/"]="docker/xfce"
            ["libs/kasm/"]="docker/kasm"
            ["libs/lumier/"]="docker/lumier"
            ["libs/qemu-docker/android/"]="docker/qemu-android"
            ["libs/qemu-docker/linux/"]="docker/qemu-linux"
            ["libs/qemu-docker/windows/"]="docker/qemu-windows"
          )

          # Find all affected services from changed files
          declare -A AFFECTED_MAP
          for path_prefix in "${!PATH_TO_SERVICE[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^${path_prefix}"; then
              service="${PATH_TO_SERVICE[$path_prefix]}"
              AFFECTED_MAP["$service"]=1
            fi
          done

          if [ ${#AFFECTED_MAP[@]} -eq 0 ]; then
            echo "No publishable packages affected, skipping."
            exit 0
          fi

          echo "Affected packages:"
          for svc in "${!AFFECTED_MAP[@]}"; do echo "  - $svc"; done

          # Collect labeled packages for auto-release
          LABELED=()
          for svc in "${!AFFECTED_MAP[@]}"; do
            release_label="release:${svc}"
            if echo "$LABELS" | grep -q "\"${release_label}\""; then
              if label_was_applied_by_release_owner "$release_label"; then
                LABELED+=("$svc")
              else
                echo "::warning::$release_label was not applied by f-trycua; ignoring it."
              fi
            fi
          done

          if [ ${#LABELED[@]} -eq 0 ]; then
            echo "No owner-authorized release labels found. Daily digest will catch unreleased packages."
            exit 0
          fi

          echo ""
          echo "Packages with release labels (will auto-release):"
          for svc in "${LABELED[@]}"; do echo "  - $svc"; done

          # Trigger each labeled package independently (no cascade — deps use version ranges)
          for svc in "${LABELED[@]}"; do
            echo ""
            echo "Triggering release-bump-version: service=$svc bump_type=$BUMP_TYPE"
            gh workflow run release-bump-version.yml \
              --repo "$REPO" \
              -f service="$svc" \
              -f bump_type="$BUMP_TYPE"
            echo "Triggered successfully."
            sleep 15
          done

          echo ""
          echo "Done!"
